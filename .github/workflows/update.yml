name: Update HY2 Servers

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

concurrency:
  group: update-hy2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and build HY2 list
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          from urllib.parse import quote
          from pathlib import Path

          API = "https://api.github.com/repos/Au1rxx/free-vpn-subscriptions/contents/output/by-country"

          country_names = {
              "US": "United States",
              "JP": "Japan",
              "DE": "Germany",
              "GB": "United Kingdom",
              "FR": "France",
              "NL": "Netherlands",
              "CA": "Canada",
              "SG": "Singapore",
              "HK": "Hong Kong",
              "KR": "South Korea",
              "TW": "Taiwan",
              "RU": "Russia",
              "FI": "Finland",
              "SE": "Sweden",
              "CH": "Switzerland",
              "PL": "Poland",
              "AU": "Australia",
              "IN": "India",
              "TR": "Turkey",
              "BR": "Brazil",
              "IT": "Italy",
              "ES": "Spain",
              "NO": "Norway",
              "DK": "Denmark",
              "BE": "Belgium",
              "AT": "Austria",
              "CZ": "Czech Republic",
              "RO": "Romania",
              "UA": "Ukraine",
              "IL": "Israel",
              "AE": "United Arab Emirates"
          }

          req = urllib.request.Request(
              API,
              headers={"User-Agent": "HY2-Updater"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              files = json.load(response)

          servers = []
          seen = set()

          for file in files:

              filename = file.get("name", "")

              if not filename.startswith("singbox-"):
                  continue

              if not filename.endswith(".json"):
                  continue

              country = filename[len("singbox-"):-5].upper()

              try:
                  req = urllib.request.Request(
                      file["download_url"],
                      headers={"User-Agent": "HY2-Updater"}
                  )

                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = json.load(response)

              except Exception as e:
                  print(f"Failed to download {filename}: {e}")
                  continue

              for node in data.get("outbounds", []):

                  if node.get("type") != "hysteria2":
                      continue

                  server = node.get("server")
                  port = node.get("server_port")
                  password = node.get("password")

                  if not server or not port or not password:
                      continue

                  tls = node.get("tls", {})

                  sni = tls.get("server_name", "")
                  insecure = tls.get("insecure", False)

                  if sni and (
                      sni.startswith("http://")
                      or sni.startswith("https://")
                  ):
                      sni = ""

                  host = str(server)

                  if ":" in host and not host.startswith("["):
                      host = f"[{host}]"

                  password_encoded = quote(
                      str(password),
                      safe=""
                  )

                  uri = (
                      f"hysteria2://"
                      f"{password_encoded}@"
                      f"{host}:{port}/?"
                  )

                  params = []

                  if sni:
                      params.append(
                          "sni=" + quote(
                              str(sni),
                              safe=""
                          )
                      )

                  if insecure:
                      params.append("insecure=1")

                  uri += "&".join(params)

                  key = (
                      str(server),
                      int(port),
                      str(password),
                      str(sni)
                  )

                  if key in seen:
                      continue

                  seen.add(key)

                  servers.append({
                      "countryCode": country,
                      "config": uri
                  })

          servers.sort(
              key=lambda x: (
                  x["countryCode"],
                  x["config"]
              )
          )

          counters = {}

          for server in servers:

              country = server["countryCode"]

              counters[country] = (
                  counters.get(country, 0) + 1
              )

              country_name = country_names.get(
                  country,
                  country
              )

              server["name"] = (
                  f"{country_name} "
                  f"{counters[country]}"
              )

          final_servers = []

          for server in servers:
              final_servers.append({
                  "name": server["name"],
                  "countryCode": server["countryCode"],
                  "config": server["config"]
              })

          Path("services.json").write_text(
              json.dumps(
                  final_servers,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              f"Total HY2 servers: "
              f"{len(final_servers)}"
          )

          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add services.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update HY2 servers"

      - name: Push changes
        run: |
          for i in 1 2 3 4 5; do

            echo "Push attempt $i..."

            git fetch origin main

            git rebase origin/main || {
              echo "Rebase failed."
              git rebase --abort || true
              exit 1
            }

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed."

            if [ "$i" -lt 5 ]; then
              echo "Retrying in 3 seconds..."
              sleep 3
            fi

          done

          echo "Push failed after 5 attempts."
          exit 1
