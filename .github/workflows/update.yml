name: Update HY2 Servers

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

concurrency:
  group: update-hy2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1) Same as before: download moussa every server and build services.json.
      #    Only change: duplicates (same server + port + password) are removed.
      #    This file is also the fallback if the health check below fails.
      - name: Download and build HY2 list
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from urllib.parse import quote
          from pathlib import Path

          API = "https://api.github.com/repos/Au1rxx/free-vpn-subscriptions/contents/output/by-country"

          country_names = {
              "US": "United States",
              "JP": "Japan",
              "DE": "Germany",
              "GB": "United Kingdom",
              "FR": "France",
              "NL": "Netherlands",
              "CA": "Canada",
              "SG": "Singapore",
              "HK": "Hong Kong",
              "KR": "South Korea",
              "TW": "Taiwan",
              "RU": "Russia",
              "FI": "Finland",
              "SE": "Sweden",
              "CH": "Switzerland",
              "PL": "Poland",
              "AU": "Australia",
              "IN": "India",
              "TR": "Turkey",
              "BR": "Brazil",
              "IT": "Italy",
              "ES": "Spain",
              "NO": "Norway",
              "DK": "Denmark",
              "BE": "Belgium",
              "AT": "Austria",
              "CZ": "Czech Republic",
              "RO": "Romania",
              "UA": "Ukraine",
              "IL": "Israel",
              "AE": "United Arab Emirates"
          }


          def fetch_json(url):
              headers = {"User-Agent": "HY2-Updater"}
              token = os.environ.get("GITHUB_TOKEN")
              if token and url.startswith("https://api.github.com/"):
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)


          files = fetch_json(API)

          # (server, port, password) -> every variant of the same server (different sni etc.)
          groups = {}

          for file in files:

              filename = file.get("name", "")

              if not filename.startswith("singbox-"):
                  continue

              if not filename.endswith(".json"):
                  continue

              country = filename[len("singbox-"):-5].upper()

              try:
                  data = fetch_json(file["download_url"])
              except Exception as e:
                  print(f"Failed to download {filename}: {e}")
                  continue

              for node in data.get("outbounds", []):

                  if node.get("type") != "hysteria2":
                      continue

                  server = node.get("server")
                  port = node.get("server_port")
                  password = node.get("password")

                  if not server or not port or not password:
                      continue

                  tls = node.get("tls", {}) or {}

                  sni = tls.get("server_name", "")
                  insecure = bool(tls.get("insecure", False))

                  if sni and (
                      sni.startswith("http://")
                      or sni.startswith("https://")
                  ):
                      sni = ""

                  obfs = node.get("obfs") or {}
                  obfs_type = str(obfs.get("type") or "")
                  obfs_password = str(obfs.get("password") or "")
                  ports = [str(p) for p in (node.get("server_ports") or [])]

                  host = str(server)

                  if ":" in host and not host.startswith("["):
                      host = f"[{host}]"

                  password_encoded = quote(
                      str(password),
                      safe=""
                  )

                  uri = (
                      f"hysteria2://"
                      f"{password_encoded}@"
                      f"{host}:{port}/?"
                  )

                  params = []

                  if sni:
                      params.append(
                          "sni=" + quote(
                              str(sni),
                              safe=""
                          )
                      )

                  if insecure:
                      params.append("insecure=1")

                  # obfuscation / port hopping: without them these servers cannot connect
                  if obfs_type and obfs_password:
                      params.append("obfs=" + quote(obfs_type, safe=""))
                      params.append("obfs-password=" + quote(obfs_password, safe=""))

                  if ports:
                      params.append("mport=" + quote(",".join(ports), safe=","))

                  uri += "&".join(params)

                  key = (
                      str(server).lower(),
                      int(port),
                      str(password)
                  )

                  variants = groups.setdefault(key, {"countryCode": country, "variants": []})

                  if any(v["config"] == uri for v in variants["variants"]):
                      continue

                  variants["variants"].append({
                      "config": uri,
                      "server": str(server),
                      "port": int(port),
                      "password": str(password),
                      "sni": str(sni or ""),
                      "insecure": insecure,
                      "obfs_type": obfs_type,
                      "obfs_password": obfs_password,
                      "ports": ports,
                  })

          # deterministic order, same as before: by country then config
          group_list = []

          for g in groups.values():
              g["variants"].sort(key=lambda v: v["config"])
              group_list.append(g)

          group_list.sort(
              key=lambda g: (
                  g["countryCode"],
                  g["variants"][0]["config"]
              )
          )


          def write_services(entries, path):
              counters = {}
              final_servers = []

              for countryCode, config in entries:
                  counters[countryCode] = counters.get(countryCode, 0) + 1
                  final_servers.append({
                      "name": f"{country_names.get(countryCode, countryCode)} {counters[countryCode]}",
                      "countryCode": countryCode,
                      "config": config
                  })

              Path(path).write_text(
                  json.dumps(
                      final_servers,
                      ensure_ascii=False,
                      indent=2
                  ) + "\n",
                  encoding="utf-8"
              )

              return len(final_servers)


          # untested list = fallback (one entry per unique server)
          total = write_services(
              [(g["countryCode"], g["variants"][0]["config"]) for g in group_list],
              "services.json"
          )

          # full data for the health check step
          Path("/tmp/hy2_groups.json").write_text(
              json.dumps({"country_names": country_names, "groups": group_list}),
              encoding="utf-8"
          )

          print(f"Total HY2 servers (unique): {total}")

          PY

      # 2) Install sing-box (used only to test the servers)
      - name: Install sing-box
        continue-on-error: true
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          CURL="curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120"

          URL=$($CURL -H "Authorization: Bearer $GITHUB_TOKEN" \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | jq -r '.assets[].browser_download_url | select(endswith("linux-amd64.tar.gz"))' | head -n1)

          if [ -z "$URL" ]; then
            echo "Could not find the sing-box download URL - skipping the health check."
            exit 1
          fi

          echo "Downloading $URL"
          $CURL "$URL" -o /tmp/sb.tar.gz
          mkdir -p /tmp/sb
          tar -xzf /tmp/sb.tar.gz -C /tmp/sb --strip-components=1
          sudo install -m 755 /tmp/sb/sing-box /usr/local/bin/sing-box
          sing-box version

      # 3) Health check: connect through every server for real (Hysteria2 handshake +
      #    request to a test URL). Keeps only the servers that work.
      #    If anything goes wrong here, services.json from step 1 is kept untouched.
      - name: Test servers and keep working ones
        continue-on-error: true
        timeout-minutes: 30
        run: |
          python3 <<'PY'
          import json
          import re
          import shutil
          import subprocess
          import sys
          import tempfile
          import time
          import socket
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path

          BATCH = 40                 # servers tested at the same time (one sing-box process)
          BASE_PORT = 20000
          TEST_URL = "https://cp.cloudflare.com/generate_204"
          CURL_TIMEOUT = 12
          MIN_WORKING = 3            # fewer than this = something is wrong with the test, keep the full list

          if not shutil.which("sing-box"):
              print("sing-box not installed - skipping health check, keeping the full list.")
              sys.exit(0)

          data = json.loads(Path("/tmp/hy2_groups.json").read_text(encoding="utf-8"))
          country_names = data["country_names"]
          groups = data["groups"]

          HOSTNAME = re.compile(r"^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$")


          def clean_sni(value):
              v = str(value or "").strip().rstrip(".")
              if not v or v.lower() in ("off", "none"):
                  return ""
              return v if HOSTNAME.match(v) else ""


          def outbound(node, tag):
              tls = {"enabled": True, "insecure": node["insecure"], "alpn": ["h3"]}
              sni = clean_sni(node["sni"])
              if sni:
                  tls["server_name"] = sni
              ob = {
                  "type": "hysteria2",
                  "tag": tag,
                  "server": node["server"],
                  "server_port": node["port"],
                  "password": node["password"],
                  "tls": tls,
              }
              if node["obfs_type"] and node["obfs_password"]:
                  ob["obfs"] = {"type": node["obfs_type"], "password": node["obfs_password"]}
              if node["ports"]:
                  ob["server_ports"] = node["ports"]
              return ob


          def dump(cfg, path):
              Path(path).write_text(json.dumps(cfg), encoding="utf-8")


          tmp = Path(tempfile.mkdtemp())

          # flat list of every variant to test
          items = []
          for gi, g in enumerate(groups):
              for vi, v in enumerate(g["variants"]):
                  items.append((gi, vi, v))

          print(f"Testing {len(items)} variants of {len(groups)} unique servers...")


          # a) syntax check of each outbound (so one bad entry cannot break a whole batch)
          def check(idx):
              _, _, v = items[idx]
              path = tmp / f"check-{idx}.json"
              dump({"log": {"level": "error"}, "outbounds": [outbound(v, "out")]}, path)
              try:
                  r = subprocess.run(["sing-box", "check", "-c", str(path)],
                                     capture_output=True, text=True, timeout=30)
                  return r.returncode == 0
              except Exception:
                  return False


          with ThreadPoolExecutor(max_workers=8) as pool:
              valid = list(pool.map(check, range(len(items))))

          testable = [i for i, ok in enumerate(valid) if ok]
          print(f"{len(testable)} configs are valid for sing-box")


          # b) real connection test
          def probe(port):
              try:
                  r = subprocess.run(
                      ["curl", "-s", "-o", "/dev/null", "-w", "%{http_code}",
                       "--socks5-hostname", f"127.0.0.1:{port}",
                       "--max-time", str(CURL_TIMEOUT), TEST_URL],
                      capture_output=True, text=True, timeout=CURL_TIMEOUT + 5)
                  return r.stdout.strip() in ("200", "204")
              except Exception:
                  return False


          def wait_ports(proc, ports, seconds=10):
              deadline = time.time() + seconds
              pending = set(ports)
              while pending and time.time() < deadline:
                  if proc.poll() is not None:
                      return False
                  for p in list(pending):
                      try:
                          with socket.create_connection(("127.0.0.1", p), timeout=0.3):
                              pending.discard(p)
                      except OSError:
                          pass
                  time.sleep(0.2)
              return not pending


          def run_batch(indices, tag):
              inbounds, outbounds, rules = [], [], []
              for j, idx in enumerate(indices):
                  inbounds.append({"type": "socks", "tag": f"in-{j}",
                                   "listen": "127.0.0.1", "listen_port": BASE_PORT + j})
                  outbounds.append(outbound(items[idx][2], f"out-{j}"))
                  rules.append({"inbound": [f"in-{j}"], "outbound": f"out-{j}"})
              cfg_path = tmp / f"batch-{tag}.json"
              # no "direct" outbound on purpose: a failed rule can never leak a direct connection
              dump({"log": {"level": "error"}, "inbounds": inbounds, "outbounds": outbounds,
                    "route": {"rules": rules, "final": "out-0"}}, cfg_path)

              proc = subprocess.Popen(["sing-box", "run", "-c", str(cfg_path)],
                                      stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              try:
                  if not wait_ports(proc, [BASE_PORT + j for j in range(len(indices))]):
                      return None  # could not start
                  with ThreadPoolExecutor(max_workers=len(indices)) as pool:
                      return list(pool.map(probe, [BASE_PORT + j for j in range(len(indices))]))
              finally:
                  proc.terminate()
                  try:
                      proc.wait(timeout=5)
                  except Exception:
                      proc.kill()


          working = set()

          for start in range(0, len(testable), BATCH):
              chunk = testable[start:start + BATCH]
              result = run_batch(chunk, start)
              if result is None:
                  # batch failed to start: test its servers one by one
                  print(f"Batch {start // BATCH + 1}: failed to start, testing individually")
                  result = []
                  for k, idx in enumerate(chunk):
                      r = run_batch([idx], f"{start}-{k}")
                      result.append(bool(r and r[0]))
              for idx, ok in zip(chunk, result):
                  if ok:
                      working.add(idx)
              print(f"Batch {start // BATCH + 1}: {sum(result)}/{len(chunk)} working")

          # c) per unique server keep the first working variant
          chosen = {}
          for idx in sorted(working):
              gi = items[idx][0]
              chosen.setdefault(gi, items[idx][2]["config"])

          print(f"Working servers: {len(chosen)} of {len(groups)}")

          if len(chosen) < MIN_WORKING:
              print("Too few working servers - the test itself is probably broken. Keeping the full list.")
              sys.exit(0)

          counters = {}
          final_servers = []
          for gi in sorted(chosen):
              code = groups[gi]["countryCode"]
              counters[code] = counters.get(code, 0) + 1
              final_servers.append({
                  "name": f"{country_names.get(code, code)} {counters[code]}",
                  "countryCode": code,
                  "config": chosen[gi],
              })

          Path("services.json").write_text(
              json.dumps(final_servers, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(f"services.json written with {len(final_servers)} working servers")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add services.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update HY2 servers"

      - name: Push changes
        run: |
          for i in 1 2 3 4 5; do

            echo "Push attempt $i..."

            git fetch origin main

            git rebase origin/main || {
              echo "Rebase failed."
              git rebase --abort || true
              exit 1
            }

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed."

            if [ "$i" -lt 5 ]; then
              echo "Retrying in 3 seconds..."
              sleep 3
            fi

          done

          echo "Push failed after 5 attempts."
          exit 1
